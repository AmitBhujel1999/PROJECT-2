<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- App feel: no pinch / double-tap zoom, and iPhone does not zoom in on a tapped box. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="color-scheme" content="light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Home-screen app (iPhone "Add to Home Screen", Android "Install app"). -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Mero Lekhapal" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="theme-color" content="#0f172a" />
		<title>Mero Lekhapal - Accounting &amp; Inventory</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
