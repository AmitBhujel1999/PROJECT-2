name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MeroLekhapal.apk

      - name: Save the APK with this run
        uses: actions/upload-artifact@v5
        with:
          name: MeroLekhapal-apk
          path: MeroLekhapal.apk

      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mero-lekhapal-app-${{ github.run_number }}
          name: Mero Lekhapal phone app, build ${{ github.run_number }}
          body: |
            Mero Lekhapal - Accounting & Inventory, phone app.

            1. Download **MeroLekhapal.apk** on your Android phone and open it to install
               (allow "Install unknown apps" for your browser or Files app if asked).
            2. On the computer, open **Mero Lekhapal** (install it with MeroLekhapalSetup.exe).
               Its window title shows the phone address, e.g. http://192.168.1.72:4173.
            3. Enter that address in the phone app. The phone must be on the same Wi-Fi
               (or connected through Tailscale). If it cannot connect, set the computer's
               Wi-Fi network to Private in Windows settings.
          files: MeroLekhapal.apk
