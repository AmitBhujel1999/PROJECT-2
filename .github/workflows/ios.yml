name: Build iPhone app

on:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      # Unsigned build: Sideloadly / AltStore sign it with the user's Apple ID when installing.
      - name: Build the app
        working-directory: ios-app
        run: |
          xcodegen generate
          xcodebuild -project MeroLekhapal.xcodeproj -scheme MeroLekhapal -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MeroLekhapal.app Payload/
          zip -qry ../MeroLekhapal.ipa Payload

      - name: Save the app with this run
        uses: actions/upload-artifact@v5
        with:
          name: MeroLekhapal-ipa
          path: MeroLekhapal.ipa

      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mero-lekhapal-ios-${{ github.run_number }}
          name: Mero Lekhapal iPhone app, build ${{ github.run_number }}
          body: |
            Mero Lekhapal - Accounting & Inventory, iPhone and iPad app (unsigned).

            1. Download **MeroLekhapal.ipa** on your Windows PC.
            2. Install it with Sideloadly (or AltStore) using your Apple ID. With a free Apple ID
               the app must be re-installed every 7 days.
            3. On the iPhone: Settings > General > VPN & Device Management > trust your Apple ID.
            4. Open the app and enter the phone address shown in the Mero Lekhapal window title on
               the computer, e.g. http://192.168.1.84:4173. Tap Allow when asked about the local network.

            No install needed: in Safari open that address and tap Share > Add to Home Screen.
          files: MeroLekhapal.ipa
