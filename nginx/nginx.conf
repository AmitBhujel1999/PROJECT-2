# Reverse proxy: one origin for the SPA and the API, so the session and CSRF
# cookies are first-party and no CORS is needed in production.

# Resolve service names at request time (Docker DNS) so nginx starts and
# recovers even if a container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend:3000;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/csv image/svg+xml;
    gzip_min_length 1024;

    # Django sets security headers on /api and /admin; the SPA gets its own below.

    proxy_set_header Host $http_host;
    # Overwrite (never append) so clients cannot spoof their IP in audit logs.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    # SvelteKit sends large Link (modulepreload) headers on deep routes.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location = /api/auth/login/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
    }

    location = /admin/login/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
    }

    location /admin/ {
        proxy_pass $backend_upstream;
    }

    location /static/ {
        proxy_pass $backend_upstream;
        expires 7d;
    }

    location / {
        proxy_pass $frontend_upstream;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
